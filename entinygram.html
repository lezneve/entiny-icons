  <title>плагіни й репозиторії — entinygram</title>
  <link rel="stylesheet" href="./gallery.css">
  <style>
    .comparison-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      flex-wrap: wrap;
      margin-bottom: 26px;
    }

    .comparison-head .intro { margin: 0; }
    .compare-controls, .compare-controls fieldset { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .compare-controls fieldset { padding: 0; margin: 0; border: 0; }
    .compare-controls legend { padding: 0; color: var(--muted); font-size: .8rem; }
    .compare-controls label { position: relative; cursor: pointer; }
    .compare-controls input { position: absolute; opacity: 0; }
    .compare-controls label span { display: grid; place-items: center; min-height: 44px; padding-inline: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; font-size: .84rem; }
    .compare-controls input:checked + span { border-color: var(--accent); background: var(--accent-wash); color: var(--accent); }
    .compare-controls input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

    .comparison:has([value="16"]:checked) { --sample-size: 16px; }
    .comparison:has([value="24"]:checked) { --sample-size: 24px; }
    .comparison:has([value="dark"]:checked) { --sample-ink: #eff5e5; --sample-paper: #20251f; }
    .compare-section { margin-top: 32px; }
    .compare-section h2 { font-size: clamp(1.5rem, 3vw, 2rem); margin-bottom: 12px; }
    .compare-list { list-style: none; margin: 0; padding: 0; border-bottom: 1px solid var(--line); }
    .compare-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr);
      align-items: center;
      gap: clamp(12px, 5vw, 64px);
      padding-block: 17px;
      border-top: 1px solid var(--line);
    }
    .compare-row :is(h2, h3) { font-size: clamp(1rem, 2.2vw, 1.27rem); line-height: 1.25; }
    .compare-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .compare-pair figure { margin: 0; text-align: center; }
    .compare-pair figcaption { margin-bottom: 4px; color: var(--muted); font-size: .82rem; }
    .compare-swatch { display: grid; place-items: center; min-height: 60px; border: 1px solid var(--line); border-radius: 7px; background: var(--sample-paper, #edeee8); }
    .compare-empty { color: var(--sample-ink, #222720); opacity: .78; font-size: .82rem; }
    .compare-icon { display: block; width: var(--sample-size, 32px); height: var(--sample-size, 32px); background: var(--sample-ink, #222720); mask: var(--shape) center / contain no-repeat; }

    @media (max-width: 520px) {
      .compare-row { grid-template-columns: 1fr; gap: 8px; }
      .compare-swatch { min-height: 52px; }
    }
  </style>
</head>
